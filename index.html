<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFL — Fut French League</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef2f7;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:20;background:#0b0f15ee;border-bottom:1px solid #202733;backdrop-filter:blur(14px)}.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:42px;height:42px;object-fit:contain}.brand span{font-size:20px}nav{display:flex;gap:7px;overflow:auto}nav button,.tab{border:1px solid #27303d;background:#111722;color:#b9c2d0;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:800;white-space:nowrap}nav button.active,.tab.active,button.primary{background:#1769ff;color:#fff;border-color:#1769ff}main{max-width:1200px;margin:auto;padding:28px 18px 70px}.hero{padding:34px;border:1px solid #222b38;border-radius:22px;background:linear-gradient(135deg,#101722,#0a0e14);text-align:center}.hero img{width:100px}.hero h1{font-size:46px;margin:12px 0 5px}.muted{color:#8e99a9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0e131b;border:1px solid #222b38;border-radius:16px;padding:18px}.section{margin-top:28px}.section h2{margin:0 0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tablewrap{overflow:auto}.standings{width:100%;border-collapse:collapse;min-width:650px}.standings th,.standings td{padding:10px;border-bottom:1px solid #202733;text-align:center}.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.teamlogo{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.teamcard{text-align:center}.teamcard img{width:68px;height:68px;object-fit:contain}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.side{text-align:center;font-weight:800}.score{font-size:22px;font-weight:900}.admin{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin .full{grid-column:1/-1}.form{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #303a49;background:#090d13;color:#fff}.form button{padding:11px;border:0;border-radius:9px;cursor:pointer}.log{padding:8px;border-bottom:1px solid #202733;font-size:13px}.live{position:fixed;right:14px;bottom:14px;background:#101720;border:1px solid #2d3948;border-radius:999px;padding:7px 11px;color:#6cff9a;font-size:12px;font-weight:900;z-index:50}.error{background:#32151a;border:1px solid #7d2d38;color:#ffb4bd;padding:12px;border-radius:10px;margin-top:12px}.statrow{display:flex;align-items:center;gap:12px;padding:11px;border-bottom:1px solid #202733}.statrow img{width:35px;height:35px;object-fit:contain}.empty{color:#8e99a9;padding:20px;text-align:center}@media(max-width:800px){.grid,.teams,.admin{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}@media(max-width:560px){.nav{align-items:flex-start;flex-wrap:wrap}.grid,.teams,.admin{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:31px}}
</style></head><body><header><div class="nav"><div class="brand"><img src="/assets/ffl.png"><span>FFL</span></div><nav id="nav"></nav></div></header><main id="app"></main><div class="live" id="live">● EN DIRECT</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const groups={A:['Pays Bas','Italie','Uruguay','Égypte'],B:['Espagne','Argentine','Croatie','Norvège'],C:['Algérie','Colombie','Allemagne','Belgique'],D:['Sénégal','Japon','Tunisie','Brésil'],E:['Grèce','Angleterre','États Unis','Madagascar'],F:['Comores','Maroc','France','Canada']};
const slots={}; Object.entries(groups).forEach(([g,ts])=>ts.forEach((t,i)=>slots[t]=`/assets/team-${g}${i+1}.png`));
let sb=null, config=null, page='home', group='A', admin=false, stats=[], standings=[], matches=[], state=null, logs=[];
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logo(t){return `<img class="teamlogo" src="${slots[t]||'/assets/ffl.png'}" onerror="this.src='/assets/ffl.png'">`}
function go(p){page=p; render()}function render(){document.getElementById('nav').innerHTML=[['home','Accueil'],['ranking','Classement'],['matches','Matchs'],['teams','Équipes'],['stats','STATS'],['admin','Admin']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join(''); if(page==='home')home();if(page==='ranking')ranking();if(page==='matches')matchPage();if(page==='teams')teams();if(page==='stats')statsPage();if(page==='admin')adminPage()}
function home(){app.innerHTML=`<section class="hero"><img src="/assets/ffl.png"><h1>FFL SAISON 1</h1><p class="muted">Fut French League · Coupe du Monde FFL</p></section><section class="section grid"><div class="card"><h3>⚡ Statut</h3><p>${matches.length} match(s) enregistré(s)</p></div><div class="card"><h3>📢 Breaking News</h3><p>${esc(state?.breaking_news||'Bienvenue sur la FFL !')}</p></div><div class="card"><h3>🔴 Direct</h3><p>Les changements sont synchronisés en temps réel.</p></div></section><section class="section"><h2>Derniers résultats</h2>${matches.filter(m=>m.status==='finished').slice(0,6).map(match).join('')||'<div class="empty">Aucun match terminé.</div>'}</section>`}
function ranking(){const gs=groups[group];let rows=gs.map(t=>standings.find(r=>r.team_name===t)||{team_name:t,points:0,played:0,wins:0,draws:0,losses:0,goals_for:0,goals_against:0}).map(r=>({...r,diff:Number(r.goals_for||0)-Number(r.goals_against||0)})).sort((a,b)=>b.points-a.points||b.diff-a.diff||b.goals_for-a.goals_for);app.innerHTML=`<h1>Classement</h1><div class="tabs">${Object.keys(groups).map(g=>`<button class="tab ${g===group?'active':''}" onclick="group='${g}';render()">Poule ${g}</button>`).join('')}</div><div class="card tablewrap"><table class="standings"><thead><tr><th>#</th><th>Équipe</th><th>Pts</th><th>MJ</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>Diff</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${logo(r.team_name)}${esc(r.team_name)}</td><td><b>${r.points}</b></td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.goals_for}</td><td>${r.goals_against}</td><td>${r.diff}</td></tr>`).join('')}</tbody></table></div>`}
function match(m){return `<div class="card" style="margin:9px 0"><div class="match"><div class="side">${logo(m.home_team)}${esc(m.home_team)}</div><div class="score">${m.home_score} - ${m.away_score}</div><div class="side">${logo(m.away_team)}${esc(m.away_team)}</div></div><small class="muted">Poule ${esc(m.group_name)} · ${esc(m.status)}</small></div>`}
function matchPage(){app.innerHTML=`<h1>Matchs / Résultats</h1>${matches.map(match).join('')||'<div class="empty">Aucun match.</div>'}`}
function teams(){app.innerHTML=`<h1>Équipes</h1><div class="teams">${Object.entries(groups).flatMap(([g,ts])=>ts.map((t,i)=>`<div class="card teamcard"><img src="${slots[t]}" onerror="this.src='/assets/ffl.png'"><h3>${esc(t)}</h3><p class="muted">Poule ${g}</p></div>`)).join('')}</div>`}
function statsPage(){const top=(c)=>stats.filter(s=>s.category===c).sort((a,b)=>b.value-a.value).slice(0,15);app.innerHTML=`<h1>STATS</h1><div class="grid"><div class="card"><h2>⚽ Meilleur buteur</h2>${top('buteur').map((s,i)=>`<div class="statrow"><b>${i+1}</b>${logo(s.club)}<span>${esc(s.player_name)} — <b>${s.value}</b> buts</span></div>`).join('')||'<div class="empty">Aucun buteur.</div>'}</div><div class="card"><h2>🎯 Meilleur passeur</h2>${top('passeur').map((s,i)=>`<div class="statrow"><b>${i+1}</b>${logo(s.club)}<span>${esc(s.player_name)} — <b>${s.value}</b> passes</span></div>`).join('')||'<div class="empty">Aucun passeur.</div>'}</div></div>`}
async function adminPage(){if(!admin){app.innerHTML=`<div class="card" style="max-width:500px;margin:auto"><h1>Administration</h1><div class="form"><input id="pw" type="password" placeholder="Mot de passe"><button class="primary" onclick="login()">Entrer</button><div id="ae"></div></div></div>`;return}app.innerHTML=`<h1>Administration</h1><div class="admin"><div class="card"><h2>Breaking News</h2><div class="form"><input id="bn" value="${esc(state?.breaking_news||'')}"><button class="primary" onclick="save('breaking_news',document.getElementById('bn').value)">Enregistrer</button></div></div><div class="card"><h2>Annonce globale</h2><div class="form"><input id="at" placeholder="Titre" value="${esc(state?.announcement_title||'')}"><textarea id="am" placeholder="Message">${esc(state?.announcement_message||'')}</textarea><button class="primary" onclick="announce()">Publier</button><button onclick="clearAnnounce()">Retirer</button></div></div><div class="card"><h2>Résultat</h2><div class="form"><select id="mg">${Object.keys(groups).map(g=>`<option>${g}</option>`).join('')}</select><select id="mh"></select><select id="ma"></select><input id="hs" type="number" min="0" placeholder="Score domicile"><input id="as" type="number" min="0" placeholder="Score extérieur"><button class="primary" onclick="resultat()">Valider le match</button></div></div><div class="card"><h2>STATS</h2><div class="form"><select id="sc"><option value="buteur">Buteur</option><option value="passeur">Passeur</option></select><input id="sn" placeholder="Nom du joueur"><input id="sv" type="number" min="0" placeholder="Nombre"><select id="club">${Object.keys(slots).map(t=>`<option>${esc(t)}</option>`).join('')}</select><button class="primary" onclick="addStat()">Ajouter</button></div></div><div class="card full"><h2>Journal</h2>${logs.map(l=>`<div class="log"><b>${esc(l.action)}</b> — ${esc(l.message)}</div>`).join('')||'<div class="empty">Aucun log.</div>'}</div></div>`;fillTeams();}
function fillTeams(){const g=document.getElementById('mg'),h=document.getElementById('mh'),a=document.getElementById('ma');if(!g)return;h.innerHTML=groups[g.value].map(t=>`<option>${esc(t)}</option>`).join('');a.innerHTML=groups[g.value].map(t=>`<option>${esc(t)}</option>`).join('');}
async function readJsonResponse(r,label){const text=await r.text();let j=null;try{j=text?JSON.parse(text):null}catch(e){const preview=text.replace(/\s+/g,' ').slice(0,220);throw new Error(`${label} a renvoyé une réponse non JSON (${r.status}). ${preview||'Réponse vide.'}`)}if(!r.ok)throw new Error(j?.error||`${label} a renvoyé HTTP ${r.status}`);return j||{}}
async function api(action,data={}){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','x-admin-password':sessionStorage.fflAdmin||''},body:JSON.stringify({action,...data,password:sessionStorage.fflAdmin||''})});return readJsonResponse(r,'/api/admin')}
async function login(){try{await api('login',{password:document.getElementById('pw').value});sessionStorage.fflAdmin=document.getElementById('pw').value;admin=true;await loadAdmin();render()}catch(e){document.getElementById('ae').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function loadAdmin(){const s=await api('get_state');state=s.state||{};const l=await api('get_logs');logs=l.logs||[]}
async function save(k,v){try{const j=await api('set_state',{field:k,value:v});state=j.state||state;render()}catch(e){alert(e.message)}}
async function announce(){try{const j=await api('announce',{title:document.getElementById('at').value,message:document.getElementById('am').value});state=j.state||state;render()}catch(e){alert(e.message)}}async function clearAnnounce(){try{const j=await api('clear_announcement');state=j.state||state;render()}catch(e){alert(e.message)}}
async function resultat(){try{const g=document.getElementById('mg').value,a=document.getElementById('mh').value,b=document.getElementById('ma').value,hs=+document.getElementById('hs').value,as=+document.getElementById('as').value;if(a===b)throw Error('Choisis deux équipes différentes.');await api('record_match',{group:g,teamA:a,teamB:b,scoreA:hs,scoreB:as});await refresh();render()}catch(e){alert(e.message)}}
async function addStat(){try{await api('add_stat',{category:document.getElementById('sc').value,player_name:document.getElementById('sn').value,value:+document.getElementById('sv').value,club:document.getElementById('club').value});await refresh();render()}catch(e){alert(e.message)}}
async function refresh(){const [st,mt,ss]=await Promise.all([sb.from('ffl_standings').select('*'),sb.from('ffl_matches').select('*').order('created_at',{ascending:false}),sb.from('fyfl_stats').select('*')]);if(st.error)console.warn(st.error);if(mt.error)console.warn(mt.error);if(ss.error)console.warn(ss.error);standings=st.data||[];matches=mt.data||[];stats=ss.data||[];const q=await sb.from('ffl_admin_state').select('*').eq('id',1).maybeSingle();state=q.data||state||{}}
async function init(){const r=await fetch('/api/config',{headers:{'Accept':'application/json'},cache:'no-store'});const c=await readJsonResponse(r,'/api/config');if(!c.ok||!c.url||!c.key)throw Error(c.error||'La configuration Supabase est incomplète.');config=c;sb=supabase.createClient(c.url,c.key);await refresh();sb.channel('ffl-live').on('postgres_changes',{event:'*',schema:'public',table:'ffl_standings'},()=>refresh().then(render)).on('postgres_changes',{event:'*',schema:'public',table:'ffl_matches'},()=>refresh().then(render)).on('postgres_changes',{event:'*',schema:'public',table:'fyfl_stats'},()=>refresh().then(render)).on('postgres_changes',{event:'*',schema:'public',table:'ffl_admin_state'},()=>refresh().then(render)).subscribe();render();if(sessionStorage.fflAdmin){admin=true;loadAdmin().catch(()=>{admin=false;sessionStorage.removeItem('fflAdmin')})}}
init().catch(e=>{app.innerHTML=`<div class="card"><h1>Erreur de connexion</h1><div class="error">${esc(e.message)}</div></div>`});
</script></body></html>
